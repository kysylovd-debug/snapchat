<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f7f7f7;
      color: #111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background: #fff;
      border-radius: 22px;
      padding: 32px 24px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
      text-align: center;
    }

    .logo {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: #fffc00;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: #666;
      margin-bottom: 24px;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 1px solid #ddd;
      border-radius: 14px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #fffc00;
      box-shadow: 0 0 0 4px rgba(255, 252, 0, 0.25);
    }

    button {
      width: 100%;
      padding: 14px 16px;
      border: none;
      border-radius: 999px;
      background: #fffc00;
      color: #111;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
    }

    .links {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .links a {
      color: #555;
      text-decoration: none;
      font-size: 14px;
    }

    .links a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .card {
        padding: 26px 18px;
        border-radius: 18px;
      }

      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">S</div>
    <h1>Connexion</h1>
    <p class="subtitle">Connecte-toi à ton compte</p>

    <form>
      <input type="email" placeholder="Adresse e-mail" />
      <input type="password" placeholder="Mot de passe" />
      <button type="submit">Se connecter</button>
    </form>

    <div class="links">
      <a href="#">Mot de passe oublié ?</a>
      <a href="#">Créer un compte</a>
    </div>
  </div>
</body>
</html>
