<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snapchat – Se connecter</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f7f7f7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    }

    .card {
      background: #ffffff;
      border-radius: 6px;
      padding: 32px 24px 28px;
      width: 100%;
      max-width: 300px;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
    }

    .logo {
      width: 64px;
      height: 64px;
      margin-bottom: 20px;
      object-fit: contain;
    }

    /* Fantôme Snapchat par défaut si pas de logo personnalisé */
    .logo-placeholder svg {
      width: 64px;
      height: 64px;
    }

    .card-title {
      font-size: 26px;
      font-weight: 500;
      color: #16191c;
      text-align: center;
      margin-top: -8px;
      margin-bottom: 24px;
      line-height: 1.25;
    }

    .form-group {
      width: 100%;
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 400;
      color: ##808080;
      margin-bottom: 6px;
      text-align: left;
    }

    .form-input {
      width: 100%;
      padding: 10px 12px;
      border: 1.5px solid #e0e0e0;
      border-radius: 6px;
      font-size: 15px;
      color: #e3e3e3;
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
    }

    .form-input:focus {
      border-color: #0fadff;
    }

    .btn-next {
      width: auto;
      padding: 10px 16px;
      background-color: #0fadff;
      color: #ffffff;
      border: none;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 400;
      cursor: pointer;
      margin-top: 4px;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn-next:hover {
      opacity: 0.88;
    }

    .btn-next:active {
      transform: scale(0.98);
    }

    .footer-text {
      margin-top: 28px;
      font-size: 14px;
      font-weight: 400;
      color: #16191c;
      text-align: center;
    }

    .footer-text a {
      font-weight: 500;
      color: #16191c;
      text-decoration: none;
    }

    .footer-text a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="card">

    <!-- LOGO : remplacez "VOTRE_LOGO.png" par le chemin de votre image -->
    <img class="logo" src="logo.png" alt="Logo"
         onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='block';" />

    <!-- Fantôme Snapchat affiché si votre logo ne charge pas -->
    <div class="logo-placeholder" id="logo-fallback" style="display:none; margin-bottom:20px;">
      <svg viewBox="0 0 120 130" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M60 4C38 4 22 20 22 44v28c0 2-1 4-3 6l-5 4c-1 1-1 2 0 3 6 3 10 7 11 12 0 1 1 2 2 2 3 0 6-1 9-2 1 0 2 0 3 1 4 4 10 6 21 6s17-2 21-6c1-1 2-1 3-1 3 1 6 2 9 2 1 0 2-1 2-2 1-5 5-9 11-12 1-1 1-2 0-3l-5-4c-2-2-3-4-3-6V44C98 20 82 4 60 4z" fill="#16191c"/>
        <path d="M60 8C40 8 26 22 26 44v28c0 3-2 6-4 8l-4 3c5 3 9 7 10 12 2 0 5-1 8-2 2-1 4 0 6 2 3 3 8 5 18 5s15-2 18-5c2-2 4-3 6-2 3 1 6 2 8 2 1-5 5-9 10-12l-4-3c-2-2-4-5-4-8V44C94 22 80 8 60 8z" fill="#fff"/>
      </svg>
    </div>

    <h1 class="card-title">Se connecter à<br>Snapchat</h1>

    <div class="form-group">
      <label class="form-label" for="email">Nom d'utilisateur ou adresse e-mail</label>
      <input class="form-input" type="text" id="email" name="email" autocomplete="username" />
    </div>

    <button class="btn-next" type="button">Suivant</button>

  </div>

  <p class="footer-text" style="margin-top: 24px;">
    Vous débutez sur Snapchat ?&nbsp;<a href="#">S'inscrire</a>
  </p>

</body>
</html>
